# Telegraf tại mỗi edge node. EDGE_NAME, MQTT_URL lấy từ biến môi trường (docker-compose).
# Cả edge-a và edge-b cùng poll thiết bị; round_interval + precision 1s cho cùng timestamp,
# nên phía nhận khử trùng bằng khóa (site, point, ts).

[agent]
  interval = "2s"
  round_interval = true
  flush_interval = "1s"
  flush_jitter = "0s"
  precision = "1s"
  hostname = "${EDGE_NAME}"

# CRAC-01: nhiệt độ gió cấp (°C × 10) ở holding register 0
[[inputs.modbus]]
  name = "crac01"
  slave_id = 1
  timeout = "1s"
  controller = "tcp://sim:5020"
  configuration_type = "register"
  holding_registers = [
    { name = "supply_temp", byte_order = "AB", data_type = "UFIXED", scale = 0.1, address = [0] },
  ]

# UPS-01: tải (% × 10) ở holding register 1
[[inputs.modbus]]
  name = "ups01"
  slave_id = 1
  timeout = "1s"
  controller = "tcp://sim:5020"
  configuration_type = "register"
  holding_registers = [
    { name = "load_pct", byte_order = "AB", data_type = "UFIXED", scale = 0.1, address = [1] },
  ]

# Đẩy lên MQTT broker cục bộ của edge node (QoS1). Broker tự bridge lên cloud.
[[outputs.mqtt]]
  servers = ["${MQTT_URL}"]
  client_id = "${EDGE_NAME}-telegraf"
  topic = 'dcim/site01/tm/{{ .Tag "name" }}'
  qos = 1
  keep_alive = 30
  layout = "non-batch"
  data_format = "json"

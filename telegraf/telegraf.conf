# Telegraf tại mỗi edge node: phần chung của edge (agent + gửi MQTT). EDGE_NAME, MQTT_URL lấy từ biến
# môi trường (docker-compose). Danh sách thiết bị KHÔNG viết ở đây: /cfg/devices.conf sinh từ Point Map
# (lab/gen_edge_config.py), được nạp kèm bằng --config.
# Cả edge-a và edge-b cùng poll thiết bị; round_interval + precision 1s cho cùng timestamp,
# nên phía nhận khử trùng bằng khóa (site, point, ts).

[agent]
  interval = "2s"
  round_interval = true
  flush_interval = "1s"
  flush_jitter = "0s"
  precision = "1s"
  hostname = "${EDGE_NAME}"

# Đẩy lên MQTT broker cục bộ của edge node (QoS1). Broker tự bridge lên cloud.
# Tag site và device do cấu hình sinh từ Point Map gắn vào từng thiết bị.
[[outputs.mqtt]]
  servers = ["${MQTT_URL}"]
  client_id = "${EDGE_NAME}-telegraf"
  topic = 'dcim/{{ .Tag "site" }}/tm/{{ .Tag "device" }}'
  qos = 1
  keep_alive = 30
  layout = "non-batch"
  data_format = "json"

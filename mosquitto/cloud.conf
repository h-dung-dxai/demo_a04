# Broker phía cloud (đại diện AWS IoT Core trong demo).
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
# Mặc định chỉ giữ 1000 tin/client: khi mất WAN lâu (vài phút), 2 bridge gửi bù dồn dập
# làm tràn hàng đợi của cloud-writer và mất dữ liệu (phát hiện khi cắt WAN 7 phút).
# AWS IoT Core thật có hạn mức riêng – cần kiểm tra khi PoC.
max_queued_messages 0

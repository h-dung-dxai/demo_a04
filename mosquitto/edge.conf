# MQTT broker tại edge node + bridge lên cloud (store-and-forward).
# Khi mất WAN, bridge giữ hàng đợi QoS1; khi nối lại thì tự gửi bù.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
max_queued_messages 200000

connection cloud
# Dùng IP, không dùng tên: mosquitto phân giải DNS kiểu blocking, khi mất WAN
# mỗi lần thử lại sẽ treo cả broker vài giây (phát hiện khi chạy demo).
address 172.30.0.10:1883
topic dcim/# out 1
cleansession false
keepalive_interval 5
restart_timeout 2
notifications false
bridge_protocol_version mqttv311
